<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:Bebas;font-weight:400;src:url(fonts/bebas-neue-latin-400-normal.woff2)}@font-face{font-family:Poppins;font-weight:700;src:url(fonts/Poppins-Bold.ttf)}body{margin:0;background:#000}</style></head><body>
<canvas id="c" width="1080" height="1080"></canvas>
<script src="lib.js"></script><script src="chars.js"></script><script src="env.js"></script><script src="flat.js"></script>
<script>
// profile pictures, 1080 x 1080, kept inside the circle platforms crop to
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), S = 1080;
function grain(a) { const R = rng(3); ctx.save(); ctx.globalCompositeOperation = 'overlay'; for (let i = 0; i < 16000; i++) { ctx.fillStyle = `rgba(${R() > .5 ? 255 : 0},${R() > .5 ? 255 : 0},${R() > .5 ? 255 : 0},${a * R()})`; ctx.fillRect(R() * S, R() * S, 2.2, 2.2); } ctx.restore(); }
function vig(a) { const v = ctx.createRadialGradient(540, 520, 300, 540, 540, 780); v.addColorStop(0, 'rgba(8,4,14,0)'); v.addColorStop(1, `rgba(8,4,14,${a})`); ctx.fillStyle = v; ctx.fillRect(0, 0, S, S); }
function wheel(cx, cy, R, col, lit) { for (const rr of [1, .92]) { circle(ctx, cx, cy, R * rr); ctx.lineWidth = R * (rr === 1 ? .035 : .018); ctx.strokeStyle = col; ctx.stroke(); } for (let i = 0; i < 16; i++) { const a = i * TAU / 16 + .2; line(ctx, cx, cy, cx + Math.sin(a) * R, cy + Math.cos(a) * R, R * .014, col); } circle(ctx, cx, cy, R * .09); ctx.fillStyle = col; ctx.fill(); if (lit) for (let i = 0; i < 40; i++) { const a = i * TAU / 40, c = ['255,214,120', '255,120,110', '120,230,255', '255,255,255'][i % 4]; glow(ctx, cx + Math.sin(a) * R, cy + Math.cos(a) * R, R * .13, c, .6); circle(ctx, cx + Math.sin(a) * R, cy + Math.cos(a) * R, R * .02); ctx.fillStyle = `rgb(${c})`; ctx.fill(); } }
window.draw = function (v) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, S, S);
  if (v === 'eyes') {
    ctx.fillStyle = lg(ctx, 0, 0, 0, S, '#1a1640', '#5a2f6e', '#d8563f', '#f6a95a'); ctx.fillRect(0, 0, S, S);
    glow(ctx, 540, 900, 760, '255,190,120', .45); wheel(540, 400, 330, '#2a2350', false);
    // the infected: head and shoulders
    ctx.fillStyle = '#14101c'; ctx.beginPath(); ctx.roundRect(250, 800, 580, 500, 190); ctx.fill(); circle(ctx, 540, 590, 265); ctx.fill();
    for (const sd of [-1, 1]) { glow(ctx, 540 + sd * 100, 600, 170, '255,255,255', .6); circle(ctx, 540 + sd * 100, 600, 44); ctx.fillStyle = '#fff'; ctx.fill(); }
    vig(.55); grain(.1);
  } else if (v === 'rule') {
    ctx.fillStyle = lg(ctx, 0, 0, 0, S, '#17142c', '#2a1d44', '#4a2440'); ctx.fillRect(0, 0, S, S);
    wheel(540, 520, 420, 'rgba(120,100,170,.28)', false); glow(ctx, 540, 560, 620, '216,57,43', .28);
    ctx.save(); ctx.translate(540, 560); ctx.rotate(-.045); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 18; box(ctx, -290, -215, 580, 430, CREAM, 26); ctx.shadowColor = 'transparent';
    rrect(ctx, -268, -193, 536, 386, 16); ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(42,34,38,.22)'; ctx.stroke();
    box(ctx, -130, -262, 260, 92, RED, 14); text(ctx, 'RULE', 0, -212, 76, CREAM, null, 0, 'Bebas', 400);
    text(ctx, '#1', 0, 30, 360, RED, null, 0, 'Bebas', 400); ctx.restore();
    vig(.6); grain(.1);
  } else {
    ctx.fillStyle = lg(ctx, 0, 0, 0, S, '#070818', '#101238', '#231a4a'); ctx.fillRect(0, 0, S, S);
    const R = rng(5); for (let i = 0; i < 70; i++) { circle(ctx, R() * S, R() * 700, 1.5 + R() * 3); ctx.fillStyle = `rgba(240,240,255,${.25 + .5 * R()})`; ctx.fill(); }
    wheel(540, 470, 350, '#1b1838', true); glow(ctx, 540, 470, 620, '255,200,140', .22);
    for (const sd of [-1, 1]) line(ctx, 540, 470, 540 + sd * 230, 1000, 24, '#1b1838');
    ctx.fillStyle = '#0c0a14'; ctx.fillRect(0, 930, S, 200);
    for (const [x, s] of [[250, 1], [420, 1.25], [640, 1.15], [830, 1]]) { ctx.fillStyle = '#0c0a14'; circle(ctx, x, 900, 78 * s); ctx.fill(); ctx.beginPath(); ctx.roundRect(x - 80 * s, 950, 160 * s, 300, 50); ctx.fill(); for (const e of [-1, 1]) { glow(ctx, x + e * 30 * s, 892, 50 * s, '255,255,255', .6); circle(ctx, x + e * 30 * s, 892, 13 * s); ctx.fillStyle = '#fff'; ctx.fill(); } }
    vig(.6); grain(.1);
  }
  return cv.toDataURL('image/png');
};
</script></body></html>
